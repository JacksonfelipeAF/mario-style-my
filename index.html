<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo Do Mario</title>
    <!-- <link rel="icon" type="image/x-icon" href="../img/favicon.ico" /> -->
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="game-container">
      <div class="game-header">
        <h1>Jogo do Mario</h1>
        <div class="game-info">
          <div id="score">Pontos: 0</div>
          <div class="controls">
            <p>Use ESPAÇO ou ↑ para pular | Clique no jogo para pular</p>
          </div>
        </div>
      </div>

      <div class="game-board">
        <img src="img/images.png" class="pipe" alt="Cano verde" />
        <img src="img/mario-gif.gif" class="mario" alt="Mario pulando" />
        <img src="img/nuven.gif" class="nuven" alt="Nuvem 1" />
        <img src="img/pngegg (1).png" class="nuven2" alt="Nuvem 2" />
        <img src="img/sol.png" class="sol" alt="Sol" />
      </div>

      <div id="game-over" class="game-over" style="display: none">
        <h2>Game Over!</h2>
        <p>Pontuação final: 0</p>
        <button onclick="resetGame()">Jogar Novamente</button>
      </div>
    </div>
  </body>
</html>
