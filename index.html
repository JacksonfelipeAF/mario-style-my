<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo Do Mario - Super Edition</title>
    <script src="js/sounds.js"></script>
    <script src="js/script-super.js" defer></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="game-container">
      <div class="game-header">
        <h1>🍄 Mario Super Edition 🍄</h1>
        <div class="game-info">
          <div class="stats">
            <div id="score">Pontos: 0</div>
            <div id="lives">Vidas: ❤️❤️❤️</div>
            <div id="level">Nível: 1</div>
            <div id="high-score">Recorde: 0</div>
          </div>
          <div class="controls">
            <p>🎮 ESPAÇO ou ↑ para pular | 🖱️ Clique para pular</p>
            <p>⚡ A cada 10 pontos = NOVO NÍVEL!</p>
            <p>❤️ 3 vidas + invencibilidade temporária</p>
          </div>
        </div>
      </div>

      <div class="game-board">
        <img src="img/images.png" class="pipe" alt="Cano verde" />
        <img src="img/mario-gif.gif" class="mario" alt="Mario pulando" />
        <img src="img/nuven.gif" class="nuven" alt="Nuvem 1" />
        <img src="img/pngegg (1).png" class="nuven2" alt="Nuvem 2" />
        <img src="img/sol.png" class="sol" alt="Sol" />
      </div>

      <div id="game-over" class="game-over" style="display: none">
        <h2>Game Over!</h2>
        <p>Pontuação final: 0</p>
        <button onclick="resetGame()">Jogar Novamente</button>
      </div>
    </div>
  </body>
</html>
